version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot-starter
    restart: unless-stopped
    
    # Variables d'environnement
    environment:
      - NODE_ENV=production
    
    # Volumes pour persistance des données
    volumes:
      # Configuration (lecture seule)
      - ./config.json:/app/config.json:ro
      # Service account Google (lecture seule)
      - ./service-account.json:/app/service-account.json:ro
      # Sessions WhatsApp (persistantes)
      - whatsapp_sessions:/app/.wwebjs_auth
      # Cache WhatsApp (persistant)
      - whatsapp_cache:/app/.wwebjs_cache
    
    # Politique de redémarrage
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    
    # Limites de ressources
    mem_limit: 512m
    cpus: 0.5

# Volumes nommés pour la persistance
volumes:
  whatsapp_sessions:
    driver: local
  whatsapp_cache:
    driver: local